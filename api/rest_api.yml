openapi: 3.0.0

info:
  title: Swagger Social Travel Network
  version: '1.0.0'
  description: |
    **Travel Social Network** is a specialized, high-load social network designed for travelers from CIS countries. The platform's primary goal is to provide users with a convenient tool for blogging about their trips, sharing geo-tagged visual content, and discovering popular new destinations based on the real-life experiences of other travelers. 

paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Get list of posts
      description: Method returns a list of posts with support for filtering(location, author, subscriptions)
      parameters:
        - name: feed_type
          in: query
          required: false
          description: "Feed type: subscriptions or all posts"
          schema:
            type: string
            enum: [subscriptions, all]
            default: all
        - name: place_id
          in: query
          required: false
          description: Place id for posts in this location
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: User id who posts we want to see
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          description: Sort field
          schema:
            type: string
            default: "created_at"
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: "desc"
        - name: limit
          in: query
          required: false
          description: Number of posts per result set
          schema:
            type: integer
            default: 10
        - name: cursor
          in: query
          required: false
          description: Cursor for retrieving the next page
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    description: List of posts
                    items:
                      $ref: '#/components/schemas/Post'
                  next_cursor:
                    type: string
                    description: Cursor for next response
        '404':
          description: Not found
        '500':
          description: Server error

  /post/{id}:
    get:
      tags:
        - Posts
      summary: Get post by id
      description: Method returns post by id
      parameters:
        - name: id
          in: path
          required: true
          description: Post id
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Not found
        '500':
          description: Server error
    put:
      tags:
        - Posts
      summary: Update post by id
      description: Updates the description and photos
      parameters:
        - name: id
          in: path
          required: true
          description: Post id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostPayload'
      responses:
        '200':
          description: Post successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '403':
          description: Forbidden. User is not the author of this post.
        '404':
          description: Post not found
        '500':
          description: Server error

    delete:
      tags:
        - Posts
      summary: Delete post by id
      description: Deletes an existing post. Only the author can perform this action.
      parameters:
        - name: id
          in: path
          required: true
          description: Post id
          schema:
            type: string
      responses:
        '200':
          description: Post successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Post has been deleted"
        '403':
          description: Forbidden. User is not the author of this post.
        '404':
          description: Post not found
        '500':
          description: Server error
  /post:
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Publishes a new post with a description, geolocated place binding, and pre-uploaded photos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostPayload'
      responses:
        '201':
          description: Post successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '500':
          description: Server error
  /places:
    get:
      tags:
        - Places
      summary: Search places
      description: Returns a list of locations
      parameters:
        - name: query
          in: query
          required: true
          description: Text search query (e.g., location name, city, or region)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of search results to return
          schema:
            type: integer
            default: 10
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination
          schema:
            type: string
      responses:
        '200':
          description: Successful search response
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  next_cursor:
                    type: string
                    example: "eyJpZCI6NX0="
        '400':
          description: Bad request. Missing required query parameter.
        '500':
          description: Server error
  /comment/{id}:
    get:
      tags:
        - Comments
      summary: Get comment by id
      description: Returns a single comment entity by its unique identifier.
      parameters:
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Comment not found
        '500':
          description: Server error
    post:
      tags:
        - Comments
      summary: Create a comment on a post
      description: Adds a new comment to the post. Limited to 10 comments per post.
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the post
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentPayload'
      responses:
        '201':
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Post not found
        '409':
          description: Comment limit reached for this post
        '500':
          description: Server error
    put:
      tags:
        - Comments
      summary: Update comment text
      description: Updates the text payload
      parameters:
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentPayload'
      responses:
        '200':
          description: Comment successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          description: Forbidden. User is not the author of this comment.
        '404':
          description: Comment not found
        '500':
          description: Server error

    delete:
      tags:
        - Comments
      summary: Delete comment by id
      description: Deletes an existing comment. Only the author or post owner can perform this action.
      parameters:
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
      responses:
        '200':
          description: Comment successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
        '403':
          description: Forbidden
        '404':
          description: Comment not found

  /post/{id}/comments:
    get:
      tags:
        - Comments
      summary: List comments for a post
      description: Returns a paginated list of comments
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the post
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of comments
          schema:
            type: integer
            default: 10
        - name: cursor
          in: query
          required: false
          description: Cursor for the next page of comments
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    description: List of comment entities
                    items:
                      $ref: '#/components/schemas/Comment'
                  next_cursor:
                    type: string
                    description: Cursor to fetch the next batch of comments
        '404':
          description: Post not found
        '500':
          description: Server error
  /post/{id}/likes:
    post:
      tags:
        - Likes
      summary: Toggle like on a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes_count:
                    type: integer
                  is_liked:
                    type: boolean
        '404':
          description: Not found
        '500':
          description: Server error

    get:
      tags:
        - Likes
      summary: List users who liked the post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Like'
                  next_cursor:
                    type: string
        '404':
          description: Not found
        '500':
          description: Server error

  /user/{id}/subscribe:
    post:
      tags:
        - Subscriptions
      summary: Subscribe to a user
      description: Creates a subscription
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the user you want to subscribe
          schema:
            type: string
      responses:
        '201':
          description: Successfully subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Bad request
        '500':
          description: Server error

    delete:
      tags:
        - Subscriptions
      summary: Unsubscribe from a user
      description: Removes the subscription
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the user you want to unsubscribe
          schema:
            type: string
      responses:
        '200':
          description: Successfully unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
        '404':
          description: Subscription not found
components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Post id
        user_id:
          type: string
          format: int64
          description: User id who left the post
        place_id:
          type: string
          format: int64
          description: Location id
        description:
          type: string
          description: Description of the post
        photos:
          type: array
          description: List of images
          maxItems: 10
          items:
            type: string
            example: "https://example.ru"
        created_at:
          type: string
          format: date-time
          description: Date and time
        updated_at:
          type: string
          format: date-time
          description: Date and time
        likes_count:
          type: number
          description: Amount of likes
        comments_count:
          type: number
          description: Amount of likes
    CreatePostPayload:
      type: object
      required:
        - place_id
        - photo_paths
      properties:
        place_id:
          type: string
          format: int64
          description: Identifier of the location
        description:
          type: string
          maxLength: 250
          description: Post text description
          example: "Description"
        photo_paths:
          type: array
          minItems: 1
          maxItems: 10
          description: Array of paths or IDs
          items:
            type: string
            example: "media/users/4521/photo_1.png"
    UpdatePostPayload:
      type: object
      properties:
        description:
          type: string
          maxLength: 250
          description: Updated post text description
          example: "Updated text"
        photo_paths:
          type: array
          maxItems: 10
          description: Updated array of photo paths
          items:
            type: string
            example: "media/users/4521/photo_updated.png"
    Comment:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Comment id
        post_id:
          type: string
          format: int64
          description: Post id
        user_id:
          type: string
          format: int64
          description: User id who left this comment
        text:
          type: string
          description: Text of this comment
        created_at:
          type: string
          format: date-time
          description: Date and time
    CreateCommentPayload:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 60
          description: Text payload of the comment
    Subscription:
      type: object
      properties:
        follower_id:
          type: string
          format: int64
          description: Follower id
        followee_id:
          type: string
          format: int64
          description: Followee id
    Like:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Like id
        user_id:
          type: string
          format: int64
          description: User Id who left this like
        post_id:
          type: string
          format: int64
          description: Id of post
        created_at:
          type: string
          format: date-time
          description: Date and time
    Place:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Id of the location (place_id)
        name:
          type: string
          description: Name of the place
        region:
          type: string
          description: Country or region of the location
        posts_count:
          type: integer
          description: Total number of posts
